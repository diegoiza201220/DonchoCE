<div class="divLogin">
  <form>
    <div id="divUsuario" *ngIf="mostrarLogin">
      <div class="col-md-12 textoLogin">
        <h1 class="h3 mb-3 fw-normal">Bienvenido a DonCho</h1>
        <h1 class="h5 mb-3 fw-normal">Por favor ingresa tu usuario y password</h1>
      </div>

      <div class="col-md-12">
        <div class="form-floating">
          <input type="usuario" class="form-control" id="floatingInput" placeholder="" #usuario>
          <label for="floatingInput">Usuario</label>
        </div>
      </div>
      <div class="col-md-12">
        <div class="form-floating">
          <input type="password" class="form-control" id="floatingPassword" placeholder="Password" #password>
          <label for="floatingPassword">Password</label>
        </div>
      </div>

      <div class="col-md-12">
        <button class="btn btn-lg btn-primary" style="width: 350px;" type="submit"
          (click)="logIn(usuario.value, password.value)">Ingresar</button>
      </div>
      <div class="col-md-12 textoLogin">
        <p class="mt-5 mb-3 text-muted">Sabemos que mueres de ganas!</p>
      </div>
    </div>

    <div id="divSucursal" *ngIf="mostrarSucursales">
      <div class="col-md-12 textoLogin">
        <h1 class="h3 mb-3 fw-normal">Bienvenido a DonCho</h1>
        <h1 class="h5 mb-3 fw-normal">Selecciona tu sucursal de trabajo</h1>
        <p-dropdown 
        [options]="sucursales" 
        (onChange)="onSucursalSelect($event)"
        optionLabel="nombre"
        placeholder="Seleccionar Sucursal" />
      </div>
    </div>
    <h1 class="h5 mb-3 fw-normal" *ngIf="mostrarMensajeErrorSucursal" >No tienes SUCURSAL asignada, comunícate con el Administrador</h1>
  </form>
</div>
